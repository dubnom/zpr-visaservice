name: Go dashboard

on:
  push:
    branches: [ "main" ]
    paths:
      - 'zpr-dashboard/**'
      - '.github/workflows/zpr-dash.yml'
  pull_request:
    paths:
      - 'zpr-dashboard/**'
      - '.github/workflows/zpr-dash.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dash:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        target: [zpr-dashboard]
    uses: org-zpr/zpr-dev-tools/.github/workflows/go-build-test.yml@v1.4
    with:
      name: ${{ matrix.target }}
      path: ./${{ matrix.target }}
    secrets: inherit

  browser-tests:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zpr-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zpr-dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: zpr-dashboard/test-results/
          retention-days: 7
