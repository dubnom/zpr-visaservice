<main class="main-content"><header class="topbar"><div class="topbar-status"><div class="connection-state"><span class="state-lamp"></span><div><strong>Scenario runner</strong><small id="scenario-connection">Loading scenarios</small></div></div></div><div class="scenario-org-select"><span>Organization</span><strong id="scenario-organization">Loading</strong></div><button class="quiet" id="scenario-refresh" type="button" aria-label="Refresh scenarios" title="Refresh" hidden>↻</button></header>
<div id="scenario-error" class="scenario-error" role="alert" hidden></div>
<section class="scenario-layout"><div class="scenario-list-pane"><div class="section-head scenario-list-heading"><button id="scenario-new" type="button">New Scenario...</button></div><p id="scenario-machine-limit" class="scenario-limit">Maximum 12 machines per run</p><div id="scenario-list" class="scenario-list" aria-live="polite"></div></div>
<section class="scenario-run-pane" aria-labelledby="scenario-run-title"><div class="section-head"><div class="scenario-run-heading"><h2 id="scenario-run-title">Scenario</h2><span id="scenario-run-state" class="scenario-state idle">Idle</span></div><div class="scenario-run-actions"><button id="scenario-cancel" class="quiet" type="button" hidden>Cancel</button><button id="scenario-clear" class="quiet" type="button" hidden>Clear</button></div></div><div id="scenario-run-summary" class="scenario-run-summary"><span>No run selected</span></div><div class="scenario-track-frame" role="region" aria-label="Scenario tracks" tabindex="0"><div id="scenario-steps" class="scenario-lanes" aria-live="polite"></div></div></section></section>
<dialog id="scenario-editor-dialog" class="sim-editor-page section-block policy-page editor-page config-editor-panel scenario-editor-dialog" aria-labelledby="scenario-editor-title"><form id="scenario-editor-form" method="dialog" class="sim-editor-form"><div class="policy-toolbar"><div class="policy-identity" aria-label="Scenario"><strong id="scenario-editor-title"></strong><span id="scenario-editor-revision-label"></span><span id="scenario-editor-modified" class="policy-modified-indicator" role="status" hidden>Modified</span></div><button class="pane-collapse-toggle sim-editor-close" type="submit" aria-label="Close editor" title="Close">×</button></div><div class="editor-page-workbench"><div class="editor-assistant-layout scenario-editor-layout"><div class="editor-assistant-main editor-page-main scenario-editor-main"><div class="policy-editor-tools scenario-source-tools"><div class="policy-browser-controls"><div id="scenario-editor-actions" class="policy-files"><button id="scenario-editor-files-toggle" class="button button-refresh policy-files-toggle" type="button" aria-haspopup="menu" aria-controls="scenario-editor-file-menu" aria-expanded="false"><span>File...</span><span class="policy-picker-chevron" aria-hidden="true">⌄</span></button><div id="scenario-editor-file-menu" class="policy-file-menu" role="menu" aria-label="Scenario file operations" hidden><button id="scenario-editor-save" class="button" type="button" role="menuitem">Save</button><button id="scenario-editor-publish" class="button" type="button" role="menuitem" disabled>Publish revision</button><hr role="separator"><button class="button" type="button" role="menuitem" data-source-open>Open source...</button><button class="button" type="button" role="menuitem" data-source-download>Download source...</button><button id="scenario-source-convert" class="button" type="button" role="menuitem" hidden>Convert to YAML</button><hr role="separator"><button id="scenario-editor-discard" class="button" type="button" role="menuitem" disabled>Discard</button><button id="scenario-editor-delete" class="button danger" type="button" role="menuitem" hidden>Delete scenario</button><button id="scenario-editor-close" class="button" type="button" role="menuitem">Close</button></div><input type="file" accept=".json,.yaml,.yml,application/json,application/yaml,text/yaml,text/x-yaml" hidden data-source-file></div></div><div class="policy-attribute-toolbar"><button id="scenario-source-analyze" class="button button-next-evaluate" type="button">Analyze</button><button class="button button-save-as-ready" type="button" data-source-format>Format</button></div><div class="policy-editor-utilities"><button id="scenario-editor-mode-toggle" class="button" type="button" aria-pressed="false">Raw YAML editor</button><span data-editor-search-target="scenario-editor-source"></span><details id="scenario-editor-history-menu" class="policy-history-menu"><summary class="button policy-history-toggle" aria-label="Version history">History <span id="scenario-editor-history-count">—</span><span class="policy-picker-chevron" aria-hidden="true">⌄</span></summary><div id="scenario-editor-history" class="policy-history"></div></details></div></div><div class="scenario-builder-grid"><label class="scenario-editor-field">Scenario ID<input id="scenario-editor-id" required pattern="[a-z][a-z0-9-]*" maxlength="80" autocomplete="off"></label><label class="scenario-editor-field">Name<input id="scenario-editor-name" required maxlength="120"></label><label class="scenario-editor-field">Folder<input id="scenario-editor-folder" maxlength="160" placeholder="Regression / Network"></label><label class="scenario-editor-field scenario-description-field">Description<textarea id="scenario-editor-description" rows="2" required maxlength="500"></textarea></label><label class="scenario-parallel-field"><input id="scenario-editor-parallel" type="checkbox"> Run machine lanes in parallel</label></div><section class="scenario-step-editor"><header><div><h3>Steps</h3></div><button id="scenario-add-step" class="quiet" type="button">Add step</button></header><div id="scenario-editor-steps" class="scenario-step-editor-list"></div></section><section class="scenario-step-editor scenario-cleanup-editor"><header><div><p class="eyebrow">AFTER RUN</p><h3>Cleanup</h3></div><button id="scenario-add-cleanup" class="quiet" type="button">Add cleanup</button></header><div id="scenario-editor-cleanup" class="scenario-step-editor-list"></div></section><details id="scenario-editor-advanced" class="scenario-advanced"><summary hidden>Advanced source</summary><div class="config-source-editor scenario-source-editor"><div id="scenario-source-gutter" class="config-source-gutter" aria-label="Scenario source errors by line"></div><div class="config-code-surface"><pre id="scenario-source-highlight" aria-hidden="true"></pre><textarea id="scenario-editor-source" class="zpr-config-source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Raw scenario source"></textarea></div></div></details><p id="scenario-editor-status" class="editor-page-status" role="status" aria-live="polite" hidden></p></div><aside id="scenario-assistant-slot" class="policy-assistant-pane editor-assistant-pane scenario-assistant-pane" aria-label="Scenario design assistant"></aside></div></div></form></dialog>
</main></div><script src="/simulator-nav.js?v=19"></script><script src="/safe-display.js?v=3"></script><script src="/editor-page.js?v=18"></script><script src="/assistant-core.js?v=2"></script><script src="/design-assistant.js?v=4"></script><script src="/scenarios.js?v=39"></script><script src="/scenario-source-editor.js?v=9"></script><script src="/editor-search.js?v=7"></script></body></html>
