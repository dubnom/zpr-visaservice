<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZPR Simulator Scenarios</title><link rel="stylesheet" href="/app.css?v=79"><link rel="stylesheet" href="/simulator.css?v=23"><link rel="stylesheet" href="/sidebar.css?v=7"><script src="/sidebar.js?v=28" defer></script></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" data-simulator-nav href="/agents.html" aria-label="ZPR Simulator agents"><span class="brand-mark"><i></i><i></i><i></i></span><span><strong>ZPR</strong><small>SIMULATOR</small></span></a><nav class="primary-nav" aria-label="Simulator navigation"><a class="nav-link" data-simulator-nav href="/agents.html">Agents</a><a class="nav-link" data-simulator-nav href="/organizations.html">Organizations</a><a class="nav-link active" data-simulator-nav href="/scenarios.html">Scenarios</a><a class="nav-link" data-simulator-nav href="/activity.html">Activity</a></nav><div class="sidebar-foot"><span class="tiny-dot"></span><span>SIMULATION CONTROL</span></div></aside>
<main class="main-content"><header class="topbar"><div class="topbar-status"><div class="connection-state"><span class="state-lamp"></span><div><strong>Scenario runner</strong><small id="scenario-connection">Loading scenarios</small></div></div></div><div class="scenario-org-select"><span>Organization</span><strong id="scenario-organization">Loading</strong></div><button class="quiet" id="scenario-refresh" type="button" aria-label="Refresh scenarios" title="Refresh" hidden>↻</button></header>
<div id="scenario-error" class="scenario-error" role="alert" hidden></div>
<section class="scenario-layout"><div class="scenario-list-pane"><div class="section-head scenario-list-heading"><button id="scenario-new" type="button">New Scenario...</button></div><p id="scenario-machine-limit" class="scenario-limit">Maximum 12 machines per run</p><div id="scenario-list" class="scenario-list" aria-live="polite"></div></div>
<section class="scenario-run-pane" aria-labelledby="scenario-run-title"><div class="section-head"><div class="scenario-run-heading"><h2 id="scenario-run-title">Scenario</h2><span id="scenario-run-state" class="scenario-state idle">Idle</span></div><div class="scenario-run-actions"><button id="scenario-cancel" class="quiet" type="button" hidden>Cancel</button><button id="scenario-clear" class="quiet" type="button" hidden>Clear</button></div></div><div id="scenario-run-summary" class="scenario-run-summary"><span>No run selected</span></div><div class="scenario-track-frame" role="region" aria-label="Scenario tracks" tabindex="0"><div id="scenario-steps" class="scenario-lanes" aria-live="polite"></div></div></section></section>
<dialog id="scenario-editor-dialog" class="scenario-editor-dialog" aria-labelledby="scenario-editor-title"><form id="scenario-editor-form" method="dialog"><header class="scenario-editor-head"><div><p class="eyebrow">VERSIONED SCENARIO</p><h2 id="scenario-editor-title">New scenario</h2></div><div class="scenario-editor-head-actions"><button id="scenario-editor-analyze" class="button" type="button">Analyze</button><button id="scenario-editor-mode-toggle" class="button button-refresh" type="button" aria-pressed="false">Raw JSON editor</button><button class="quiet" type="submit" aria-label="Close editor" title="Close">×</button></div></header><div class="scenario-builder-grid"><label class="scenario-editor-field">Scenario ID<input id="scenario-editor-id" required pattern="[a-z][a-z0-9-]*" maxlength="80" autocomplete="off"></label><label class="scenario-editor-field">Name<input id="scenario-editor-name" required maxlength="120"></label><label class="scenario-editor-field">Folder<input id="scenario-editor-folder" maxlength="160" placeholder="Regression / Network"></label><label class="scenario-editor-field scenario-description-field">Description<textarea id="scenario-editor-description" rows="2" required maxlength="500"></textarea></label><label class="scenario-parallel-field"><input id="scenario-editor-parallel" type="checkbox"> Run machine lanes in parallel</label></div><section class="scenario-step-editor"><header><div><h3>Steps</h3></div><button id="scenario-add-step" class="quiet" type="button">Add step</button></header><div id="scenario-editor-steps" class="scenario-step-editor-list"></div></section><section class="scenario-step-editor scenario-cleanup-editor"><header><div><p class="eyebrow">AFTER RUN</p><h3>Cleanup</h3></div><button id="scenario-add-cleanup" class="quiet" type="button">Add cleanup</button></header><div id="scenario-editor-cleanup" class="scenario-step-editor-list"></div></section><details id="scenario-editor-advanced" class="scenario-advanced"><summary>Advanced JSON</summary><textarea id="scenario-editor-source" rows="14" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Raw scenario source"></textarea></details><div class="scenario-editor-meta"><label class="scenario-editor-field">Revision summary<input id="scenario-editor-summary" maxlength="200" placeholder="Describe this change"></label><label class="scenario-editor-field">History<select id="scenario-editor-revisions" aria-label="Scenario revision history"></select></label></div><p id="scenario-editor-status" class="scenario-editor-status" role="status" aria-live="polite"></p><footer class="scenario-editor-actions"><button id="scenario-editor-delete" class="danger quiet" type="button" hidden>Delete scenario</button><span class="scenario-editor-action-spacer"></span><button id="scenario-editor-publish" class="quiet" type="button" disabled>Publish revision</button><button id="scenario-editor-save" type="button">Create scenario</button></footer></form></dialog>
</main></div><script src="/simulator-nav.js?v=16"></script><script src="/design-assistant.js?v=3"></script><script src="/scenarios.js?v=20"></script><script src="/scenario-source-editor.js?v=2"></script><script src="/editor-search.js?v=5"></script></body></html>
