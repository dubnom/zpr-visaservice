<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZPR Simulator Scenarios</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/simulator.css?v=11"></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" data-simulator-nav href="/agents.html" aria-label="ZPR Simulator agents"><span class="brand-mark"><i></i><i></i><i></i></span><span><strong>ZPR</strong><small>SIMULATOR</small></span></a><nav class="primary-nav" aria-label="Simulator navigation"><a class="nav-link" data-simulator-nav href="/agents.html">Agents</a><a class="nav-link active" data-simulator-nav href="/scenarios.html">Scenarios</a><a class="nav-link" data-simulator-nav href="/activity.html">Activity</a></nav><div class="sidebar-foot"><span class="tiny-dot"></span><span>SIMULATION CONTROL</span></div></aside>
<main class="main-content"><header class="topbar"><div class="topbar-status"><div class="connection-state"><span class="state-lamp"></span><div><strong>Scenario runner</strong><small id="scenario-connection">Loading scenarios</small></div></div><div class="uptime-status"><span>RUN STATE</span><strong id="scenario-state-label">IDLE</strong></div></div><button class="quiet" id="scenario-refresh" type="button">Refresh</button></header>
<div id="scenario-error" class="scenario-error" role="alert" hidden></div>
<section class="scenario-layout"><div class="scenario-list-pane"><div class="section-head"><div><h2>Available scenarios</h2></div><span id="scenario-count" class="hint">—</span></div><p id="scenario-machine-limit" class="scenario-limit">Maximum 10 machines per run</p><div id="scenario-list" class="scenario-list" aria-live="polite"></div></div>
<section class="scenario-run-pane" aria-labelledby="scenario-run-title"><div class="section-head"><div><p class="eyebrow">EXECUTION</p><h2 id="scenario-run-title">Run details</h2></div><button id="scenario-cancel" class="quiet" type="button" disabled>Cancel run</button></div><div id="scenario-run-summary" class="scenario-run-summary"><span class="scenario-state idle">Idle</span><span>No scenario selected</span></div><ol id="scenario-steps" class="scenario-steps" aria-live="polite"></ol></section></section>
</main></div><script src="/simulator-nav.js?v=10"></script><script src="/scenarios.js?v=4"></script></body></html>
