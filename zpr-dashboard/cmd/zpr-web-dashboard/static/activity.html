<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZPR Simulator Activity</title><link rel="stylesheet" href="/app.css?v=86"><link rel="stylesheet" href="/simulator.css?v=25"><link rel="stylesheet" href="/sidebar.css?v=7"><script src="/sidebar.js?v=39" defer></script></head>
<body>
<div class="app-shell">
<aside class="sidebar"><a class="brand" data-simulator-nav href="/agents.html" aria-label="ZPR Simulator agents"><span class="brand-mark"><i></i><i></i><i></i></span><span><strong>ZPR</strong><small>SIMULATOR</small></span></a><nav class="primary-nav" aria-label="Simulator navigation"><a class="nav-link" data-simulator-nav href="/agents.html">Agents</a><a class="nav-link" data-simulator-nav href="/scenarios.html">Scenarios</a><a class="nav-link active" data-simulator-nav href="/activity.html">Activity</a></nav><div class="sidebar-foot"><span class="tiny-dot"></span><span>SIMULATION CONTROL</span></div></aside>
<main class="main-content"><header class="topbar"><div class="topbar-status"><div class="connection-state"><span class="state-lamp"></span><div><strong>Simulation activity</strong><small id="activity-time">Live Control Room feed</small></div></div><div class="activity-stream-actions"><div class="uptime-status"><span>STREAM</span><strong id="activity-state">LIVE</strong></div><button class="quiet" id="refresh" type="button" hidden>Refresh</button></div></div></header>
<section class="metrics-grid"><article class="metric"><div class="metric-head"><span>REQUESTS</span></div><strong class="metric-value" id="requests">—</strong></article><article class="metric"><div class="metric-head"><span>APPROVED</span></div><strong class="metric-value" id="approved">—</strong></article><article class="metric"><div class="metric-head"><span>DENIED</span></div><strong class="metric-value" id="denied">—</strong></article><article class="metric"><div class="metric-head"><span>VISAS</span></div><strong class="metric-value" id="visa-count">—</strong></article></section>
<section class="logs activity-table-section"><div class="section-head"><h2>Recent visas</h2></div><div class="table-scroll"><table class="activity-table" data-sort-page="activity-visas"><thead><tr><th data-sort-key="flow">FLOW</th><th data-sort-key="proto">PROTO</th><th data-sort-key="port">PORT</th><th data-sort-key="policy">POLICY</th><th data-sort-key="expires">EXPIRES</th></tr></thead><tbody id="visas"><tr><td colspan="5" class="empty-row">Waiting for visa activity…</td></tr></tbody></table></div></section>
<section class="logs activity-table-section"><div class="section-head"><h2>Recent denials</h2></div><div class="table-scroll"><table class="activity-table" data-sort-page="activity-denies"><thead><tr><th data-sort-key="source">SOURCE</th><th data-sort-key="destination">DESTINATION</th><th data-sort-key="protocol">PROTOCOL / PORT</th><th data-sort-key="reason">REASON</th><th data-sort-key="count">HITS</th></tr></thead><tbody id="denies"><tr><td colspan="5" class="empty-row">Waiting for denials…</td></tr></tbody></table></div></section>
</main></div><script src="/simulator-nav.js?v=18"></script><script src="/table-sort.js?v=1"></script><script src="/safe-display.js?v=1"></script><script src="/activity.js?v=15"></script>
