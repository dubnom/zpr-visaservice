<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZPR Simulator Agents</title><link rel="stylesheet" href="/app.css?v=54"><link rel="stylesheet" href="/simulator.css?v=17"><link rel="stylesheet" href="/sidebar.css?v=7"><script src="/sidebar.js?v=4" defer></script></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" data-simulator-nav href="/agents.html" aria-label="ZPR Simulator agents"><span class="brand-mark"><i></i><i></i><i></i></span><span><strong>ZPR</strong><small>SIMULATOR</small></span></a><nav class="primary-nav" aria-label="Simulator navigation"><a class="nav-link active" data-simulator-nav href="/agents.html">Agents</a><a class="nav-link" data-simulator-nav href="/scenarios.html">Scenarios</a><a class="nav-link" data-simulator-nav href="/activity.html">Activity</a></nav><div class="sidebar-foot"><span class="tiny-dot"></span><span>SIMULATION CONTROL</span></div></aside>
<main class="main-content"><header class="topbar"><div class="topbar-status"><div class="connection-state"><span class="state-lamp"></span><div><strong>Simulation agents</strong><small id="runtime-state">Loading runtime</small></div></div><div class="uptime-status"><span>ORGANIZATION</span><strong id="manifest-name">—</strong><small id="manifest-base">—</small></div></div></header>
<section class="metrics-grid"><article class="metric"><div class="metric-head"><span>AGENTS</span></div><strong class="metric-value" id="agent-count">—</strong></article><article class="metric"><div class="metric-head"><span>RUNNING</span></div><strong class="metric-value" id="running-count">—</strong></article><article class="metric"><div class="metric-head"><span>SERVICES</span></div><strong class="metric-value" id="service-count">—</strong></article><article class="metric"><div class="metric-head"><span>STACK</span></div><strong class="metric-value" id="stack-count">—</strong></article></section>
<section class="components"><div class="section-head"><div><p class="eyebrow">DEVICES</p><h2 class="devices-heading">Devices</h2></div><label class="identity-select">TYPE<select id="machine-type-filter"><option value="all">All devices</option><option value="laptop">Laptops</option><option value="desktop">Desktops</option></select></label></div><div id="machine-grid" class="machine-grid"></div></section>
<section class="logs"><div class="section-head"><div><p class="eyebrow">TELEMETRY</p><h2>Recent runtime logs</h2></div><button class="quiet" id="refresh">Refresh</button></div><div id="log-grid" class="log-grid"></div></section>
</main></div><dialog id="machine-login-dialog" class="machine-login-dialog"><form><p class="eyebrow">SIMULATED SESSION</p><h2 id="machine-login-title">Log in</h2><label class="user-select" for="machine-login-user">USER<select id="machine-login-user" required></select></label><div class="machine-login-actions"><button type="button" class="quiet" id="machine-login-cancel">Cancel</button><button type="submit" id="machine-login-submit">Log in</button></div></form></dialog><div id="toast" class="toast" hidden></div><script src="/simulator-nav.js?v=14"></script><script src="/agents.js?v=16"></script></body></html>
